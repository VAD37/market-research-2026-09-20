# infra/docker-compose.yml
#
# Local stack: Traefik (reverse proxy) + three nginx static sites + an optional
# Cloudflare Tunnel connector. See infra/README.md for the full runbook.
#
# Site content: each site-devN service mounts infra/placeholder by default so
# `docker compose up` succeeds with no project site/ folders present. Once a
# project's site\ folder exists, swap that one line (marked below) to mount it
# instead. Example for dev1:
#
#   volumes:
#     - ../projects/ai-ads-injection/site:/usr/share/nginx/html:ro
#
# Host routing: each site answers on its real hostname (dev1.vad37.com, etc.)
# AND on a *.localhost fallback host (dev1.localhost, etc.) that needs no DNS
# and no hosts-file edit — modern OSes and browsers resolve *.localhost to
# 127.0.0.1 automatically. curl can hit the real-hostname rule directly with
# `-H "Host: dev1.vad37.com"` since Traefik matches on the Host header, not on
# actual DNS resolution.
#
# Routing engine, measured 2026-09-17: Traefik's Docker provider (the labels
# below) could not talk to this machine's Docker daemon — see the long
# comment at the top of infra/traefik/dynamic.yml for the full diagnosis
# (isolated to a Traefik-vs-new-engine incompatibility, not a config error;
# reproduced on both traefik:v3.1 and traefik:v3.4). The file provider
# (infra/traefik/dynamic.yml, mounted below) carries the actual routing
# today. Labels stay so the intended label-based setup is documented and
# ready for whenever the Docker provider works again.

networks:
  edge:
    name: infra-edge

services:
  traefik:
    image: traefik:v3.4
    container_name: infra-traefik
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=infra-edge"
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--log.level=INFO"
    ports:
      # Public HTTP entrypoint — this is the only port reachable from outside
      # the host. Traefik itself decides routing by Host header.
      - "80:80"
      # Dashboard: bound to loopback only, never published to the network.
      - "127.0.0.1:8080:8080"
    environment:
      # Pins the Docker API version the embedded client negotiates. Without
      # this, Traefik v3.1's client can mis-negotiate against a much newer
      # dockerd (observed: Docker Desktop 29.6.2 / API 1.55) and the docker
      # provider fails with a blank "Error response from daemon:" — this
      # value is comfortably inside what both sides support.
      - "DOCKER_API_VERSION=1.44"
    volumes:
      # Read-only Docker socket mount — Traefik only needs to observe labels.
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      # File-provider dynamic config — see dynamic.yml for why this carries
      # the actual routing today.
      - "./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro"
    networks:
      - edge
    labels:
      - "traefik.enable=false"

  site-dev1:
    image: nginx:alpine
    container_name: infra-site-dev1
    restart: unless-stopped
    volumes:
      # Placeholder mount (works today, no site/ folder needed). Swap to:
      #   - ../projects/ai-ads-injection/site:/usr/share/nginx/html:ro
      - ./placeholder:/usr/share/nginx/html:ro
    networks:
      - edge
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dev1.rule=Host(`dev1.vad37.com`) || Host(`dev1.localhost`)"
      - "traefik.http.routers.dev1.entrypoints=web"
      - "traefik.http.services.dev1.loadbalancer.server.port=80"

  site-dev2:
    image: nginx:alpine
    container_name: infra-site-dev2
    restart: unless-stopped
    volumes:
      # Placeholder mount (works today, no site/ folder needed). Swap to:
      #   - ../projects/agent-hermes-dashboard/site:/usr/share/nginx/html:ro
      - ./placeholder:/usr/share/nginx/html:ro
    networks:
      - edge
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dev2.rule=Host(`dev2.vad37.com`) || Host(`dev2.localhost`)"
      - "traefik.http.routers.dev2.entrypoints=web"
      - "traefik.http.services.dev2.loadbalancer.server.port=80"

  site-dev3:
    image: nginx:alpine
    container_name: infra-site-dev3
    restart: unless-stopped
    volumes:
      # Placeholder mount (works today, no site/ folder needed). Swap to:
      #   - ../projects/ai-attack-defense/site:/usr/share/nginx/html:ro
      - ./placeholder:/usr/share/nginx/html:ro
    networks:
      - edge
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dev3.rule=Host(`dev3.vad37.com`) || Host(`dev3.localhost`)"
      - "traefik.http.routers.dev3.entrypoints=web"
      - "traefik.http.services.dev3.loadbalancer.server.port=80"

  # Cloudflare Tunnel connector. NOT started by `docker compose up` — it lives
  # under the "tunnel" profile, so it only runs when explicitly requested with
  # `docker compose --profile tunnel up -d cloudflared`, and only after
  # infra/cf-tunnel.py create has written infra/<tunnel-name>.json and you have
  # filled in infra/cloudflared/config.yml (see README). Absent credentials it
  # never starts, so it cannot break the default `docker compose up`.
  cloudflared:
    image: cloudflare/cloudflared:2025.6.1
    container_name: infra-cloudflared
    restart: unless-stopped
    profiles:
      - tunnel
    command: ["tunnel", "--config", "/etc/cloudflared/config.yml", "run"]
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    networks:
      - edge
    depends_on:
      - traefik
